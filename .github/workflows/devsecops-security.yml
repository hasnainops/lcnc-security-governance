name: DevSecOps Security Gate

on:
  push:
    branches:
      - main
      - feature/mvp-v3-enterprise-automation

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-security-tests:
    name: Python Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --only-binary :all: \
            pytest==9.1.1 \
            -r ml-analytics/requirements.txt \
            -r security-scanner/requirements.txt \
            -r dlp-engine/requirements.txt \
            -r integration-gateway/requirements.txt

      - name: Run ML tests
        env:
          PYTHONPATH: ml-analytics/tests
        run: |
          python -m pytest -q             ml-analytics/tests/test_analyzer.py

      - name: Run security scanner tests
        env:
          PYTHONPATH: security-scanner/tests
        run: |
          python -m pytest -q             security-scanner/tests/test_scanner.py

      - name: Run DLP tests
        run: |
          python -m pytest -q             dlp-engine/tests/test_dlp.py

      - name: Run integration gateway tests
        run: |
          python -m pytest -q             integration-gateway/tests/test_policy.py

  opa-policy-tests:
    name: OPA Policy Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: "1.19.0"

      - name: Run OPA tests
        run: opa test policies -v

  repository-security:
    name: Repository Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Ensure runtime .env is not committed
        shell: bash
        run: |
          if git ls-files | grep -Eq '(^|/)\.env$'; then
            echo "ERROR: runtime .env file is tracked by Git"
            exit 1
          fi

          echo "No tracked runtime .env file found"

      - name: Trivy vulnerability and misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
