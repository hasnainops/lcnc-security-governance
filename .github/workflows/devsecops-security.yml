name: DevSecOps Security Gate

on:
  push:
    branches:
      - main
      - feature/mvp-v3-enterprise-automation

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-security-tests:
    name: Python Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          pip install -r ml-analytics/requirements.txt
          pip install -r security-scanner/requirements.txt
          pip install -r dlp-engine/requirements.txt
          pip install -r integration-gateway/requirements.txt

      - name: Run ML tests
        env:
          PYTHONPATH: ml-analytics/tests
        run: |
          python -m pytest -q             ml-analytics/tests/test_analyzer.py

      - name: Run security scanner tests
        env:
          PYTHONPATH: security-scanner/tests
        run: |
          python -m pytest -q             security-scanner/tests/test_scanner.py

      - name: Run DLP tests
        run: |
          python -m pytest -q             dlp-engine/tests/test_dlp.py

      - name: Run integration gateway tests
        run: |
          python -m pytest -q             integration-gateway/tests/test_policy.py

  opa-policy-tests:
    name: OPA Policy Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: "1.19.0"

      - name: Run OPA tests
        run: opa test policies -v

  repository-security:
    name: Repository Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ensure runtime .env is not committed
        shell: bash
        run: |
          if git ls-files | grep -Eq '(^|/)\.env$'; then
            echo "ERROR: runtime .env file is tracked by Git"
            exit 1
          fi

          echo "No tracked runtime .env file found"

      - name: Trivy vulnerability and misconfiguration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
