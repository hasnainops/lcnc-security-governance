name: Security Validation

on:
  push:
    branches:
      - main
      - feature/mvp-v3-enterprise-automation
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Security Controls
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r risk-engine/requirements.txt \
            -r governance-api/requirements.txt \
            pytest

      - name: Validate Python syntax
        run: |
          python -m compileall -q \
            governance-api/app \
            risk-engine/app \
            discovery

      - name: Test deterministic risk engine
        run: |
          pytest -q tests/test_risk_engine.py tests/test_dependency_failures.py

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.19.0

      - name: Validate OPA policies
        run: |
          opa check policies

      - name: Test OPA policies
        run: |
          opa test policies -v

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Trivy repository security scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          version: v0.73.0
