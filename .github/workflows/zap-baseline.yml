name: OWASP ZAP Baseline

on:
  push:
    branches:
      - main
      - feature/mvp-v3-enterprise-automation

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP Baseline DAST
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Governance API
        run: |
          docker build \
            -t lcnc-governance-api-dast \
            governance-api

      - name: Start Governance API
        run: |
          docker run -d \
            --name governance-api-dast \
            -p 8000:8000 \
            -e VAULT_ROLE_ID=dast-placeholder \
            -e VAULT_SECRET_ID=dast-placeholder \
            -e POSTGRES_DB=lcnc_governance \
            lcnc-governance-api-dast

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/docs >/dev/null; then
              echo "Governance API ready"
              exit 0
            fi

            sleep 2
          done

          docker logs governance-api-dast
          exit 1

      - name: Prepare ZAP reports
        run: |
          mkdir -p zap-reports
          chmod 0777 zap-reports

      - name: Run ZAP baseline
        run: |
          docker run --rm \
            --network host \
            -v "$PWD/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8000/docs \
            -I \
            -J zap-report.json \
            -r zap-report.html

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: zap-reports/

      - name: Cleanup
        if: always()
        run: |
          docker rm -f governance-api-dast 2>/dev/null || true
