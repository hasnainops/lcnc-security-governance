version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"

  # Python dependencies across backend services
  - package-ecosystem: "pip"
    directories:
      - "/discovery"
      - "/dlp-engine"
      - "/enterprise-discovery"
      - "/governance-api"
      - "/governance-automation"
      - "/integration-gateway"
      - "/ml-analytics"
      - "/risk-engine"
      - "/security-scanner"
    schedule:
      interval: "weekly"
    groups:
      python-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"

  # Docker images across services
  - package-ecosystem: "docker"
    directories:
      - "/discovery"
      - "/dlp-engine"
      - "/enterprise-discovery"
      - "/governance-api"
      - "/governance-automation"
      - "/governance-portal"
      - "/integration-gateway"
      - "/ml-analytics"
      - "/risk-engine"
      - "/security-scanner"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "library/python"
        update-types:
          - "version-update:semver-major"
    groups:
      docker-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"

  # Docker Compose platform dependencies
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      compose-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
