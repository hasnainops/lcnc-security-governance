services:
  
  appsmith:
    image: appsmith/appsmith-ce:v2.2
    container_name: lcnc-appsmith
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - appsmith_data:/appsmith-stacks
    restart: unless-stopped

  postgres:
    image: postgres:18.4-alpine
    container_name: lcnc-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

    healthcheck:
      test:
        [
            
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:1.19.0
    container_name: lcnc-opa
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=info
    ports:
      - "127.0.0.1:8181:8181"
    restart: unless-stopped

  governance-api:
    build:
      context: ./governance-api
    container_name: lcnc-governance-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OPA_URL: http://opa:8181
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  appsmith_data:
