services:
  grafana:
    image: grafana/grafana:13.1.3
    container_name: lcnc-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: lcnc-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      governance-api:
        condition: service_healthy
      opa:
        condition: service_started
    restart: unless-stopped
  governance-portal:
    build:
      context: ./governance-portal
    container_name: lcnc-governance-portal
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      governance-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/  > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
  risk-engine:
    build:
      context: ./risk-engine
    container_name: lcnc-risk-engine
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
  discovery:
    build:
      context: ./discovery
    container_name: lcnc-discovery
    environment:
      APPSMITH_BASE_URL: http://appsmith
      APPSMITH_USER: ${APPSMITH_USER}
      APPSMITH_PASSWORD: ${APPSMITH_PASSWORD}
      GOVERNANCE_API_URL: http://governance-api:8000
      DISCOVERY_INTERVAL_SECONDS: "60"
    depends_on:
      appsmith:
        condition: service_healthy
      governance-api:
        condition: service_healthy
    restart: unless-stopped
  appsmith:
    image: appsmith/appsmith-ce:v2.2
    container_name: lcnc-appsmith
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - appsmith_data:/appsmith-stacks
    restart: unless-stopped
  postgres:
    image: postgres:18.4-alpine
    container_name: lcnc-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  opa:
    image: openpolicyagent/opa:1.19.0
    container_name: lcnc-opa
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=info
      - /policies
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - ./policies:/policies:ro
    restart: unless-stopped
  governance-api:
    build:
      context: ./governance-api
    container_name: lcnc-governance-api
    environment:
      RISK_ENGINE_URL: http://risk-engine:8001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OPA_URL: http://opa:8181
      ML_ANALYTICS_URL: http://ml-analytics:8002
    volumes:
      - ./compliance:/compliance:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      risk-engine:
        condition: service_healthy
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
      ml-analytics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  ml-analytics:
    build:
      context: ./ml-analytics
    container_name: lcnc-ml-analytics
    expose:
      - "8002"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8002/health")
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
volumes:
  postgres_data:
  appsmith_data:
  prometheus_data:
  grafana_data:
