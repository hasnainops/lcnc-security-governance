server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:;" always;

    location = /api/executive-summary {
        limit_except GET {
            deny all;
        }

        proxy_pass http://governance-automation:8007/executive-summary;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location /api/ {
        proxy_pass http://governance-api:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
