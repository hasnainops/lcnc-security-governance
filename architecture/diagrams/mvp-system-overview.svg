<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">MVP Architecture: Governance API orchestration</title>
<desc id="desc">Appsmith, Portal and two discovery paths reach a Caddy endpoint with two Governance API replicas. The API calls independent analysis, policy, automation and transfer services. The API executes external requests only after a transfer allow decision. Compliance, guidance and training remain inside the API. Database, secrets, monitoring and software validation are supporting concerns.</desc>
